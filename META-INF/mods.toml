[[mods]]
modId="ventryschat"
version="2.2.4"
displayName="VentrysChat - Chat RP"
authors="Ventrys"
description='''
🎭 VentrysChat - Mod de Chat RP pour Minecraft

Transforme le chat Minecraft en un système de rôle-play immersif avec :
• Préfixes RP spéciaux (£, *, [hrp, /narration, £ch, £cri, £hurle)
• Système de distance réaliste (4 à 500 blocs)
• Gestion des noms RP avec synchronisation
• Chat bloqué pour encourager le RP
• Couleurs non flashy et élégantes
• Support multijoueur complet

Parfait pour les serveurs RP et les joueurs qui veulent une expérience immersive !
'''

