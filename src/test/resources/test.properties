# Configuration des tests pour VentrysChat
# Fichier de propriétés pour les tests unitaires

# Configuration des tests
test.enabled=true
test.logging.level=INFO

# Configuration des assertions
test.assertions.enabled=true
test.assertions.timeout=5000

# Configuration des mocks
test.mocks.enabled=false

# Configuration des données de test
test.data.sample.names=Jean,Dupont,Marie,Martin
test.data.sample.messages=Salut tout le monde,Comment allez-vous,Bonne journée

# Configuration des préfixes de test
test.prefixes.ooc=£
test.prefixes.action=*
test.prefixes.hrp=[hrp
test.prefixes.narration=/narration
test.prefixes.whisper=£ch
test.prefixes.shout=£cri
test.prefixes.scream=£hurle

# Configuration des distances de test
test.distances.normal=15
test.distances.whisper=4
test.distances.shout=35
test.distances.scream=60
test.distances.action=15
test.distances.narration=150
